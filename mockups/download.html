<title>Файлы для скачивания</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#F9F9F9;--fg:#1B1B1B;--mut:rgba(27,27,27,.6);--card:#fff;--line:rgba(27,27,27,.12);--crimson:#D73A61;--code:#F2F3ED;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#F3F3F3;--mut:rgba(243,243,243,.6);--card:#222;--line:rgba(255,255,255,.14);--code:#1d1d1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161616;--fg:#F3F3F3;--mut:rgba(243,243,243,.6);--card:#222;--line:rgba(255,255,255,.14);--code:#1d1d1d;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:40px 64px}
main{max-width:980px;margin:0 auto;display:grid;gap:36px}
h1{margin:0;font-size:clamp(28px,5vw,40px);letter-spacing:-.02em}
p{margin:6px 0 0;color:var(--mut)}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:14px;min-width:0}
h2{margin:0;font-size:20px}
img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;font-weight:700;background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}
button:focus-visible{outline:3px solid var(--crimson);outline-offset:2px}
.ok{color:var(--crimson);font-weight:700}
textarea{width:100%;height:160px;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--code);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
</style>
<main>
<div><h1>Файлы для скачивания</h1><p>Картинки: правой кнопкой мыши → «Сохранить изображение как…». HTML: кнопка «Скопировать код», затем вставьте в пустой файл с именем, например, <b>kejsy.html</b>.</p></div>

<textarea id="h2" readonly aria-label="Код мокапа">&lt;title&gt;Кейсы 1+1 на сайте&lt;/title&gt;
&lt;meta name=&quot;claude:viewport-fit-sides&quot; content=&quot;cover&quot;&gt;
&lt;style&gt;
/* Раскладка: шапка секции → три карточки в ряд (на телефоне в одну колонку) + круглая кнопка-стрелка карусели.
   Светлый регистр бренда: фон cloud, белые карточки, дуэт crimson + olive. */
:root{
  --crimson:#D73A61;
  --olive:#6F8434;
  --olive-soft:#ABAD58;
  --ink:#1B1B1B;
  --cloud:#F6F6F2;
  --white:#FFFFFF;
  --ink-60:rgba(27,27,27,.58);
  --ink-45:rgba(27,27,27,.42);
  --line:rgba(27,27,27,.09);
  --shadow-md:0 8px 28px rgba(27,27,27,.07);
  --shadow-lg:0 16px 40px rgba(27,27,27,.13);
  --font:&quot;Manrope&quot;,&quot;Gilroy&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--cloud);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
.wrap{
  max-width:1200px;margin:0 auto;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:64px 80px;
}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.head h1{margin:0;font-size:clamp(44px,6vw,68px);font-weight:800;letter-spacing:-.03em;line-height:.95}
.head p{margin:12px 0 0;color:var(--ink-60);font-size:18px}
.all{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--olive);font-weight:800;font-size:17px;transition:gap .2s}
.all:hover{gap:14px}
.all svg,.go svg{width:18px;height:18px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:stretch}
.card{
  --acc:var(--crimson);
  display:flex;flex-direction:column;min-width:0;
  background:var(--white);border-radius:28px;padding:40px 36px 32px;
  box-shadow:var(--shadow-md);text-decoration:none;color:inherit;
  transition:transform .22s ease,box-shadow .22s ease;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.card:focus-visible{outline:3px solid var(--crimson);outline-offset:3px}
.c2{--acc:var(--olive)}
.c3{--acc:var(--ink)}

.ico{width:44px;height:44px;color:var(--acc);margin-bottom:34px;display:block}
.ico.m{color:var(--crimson)}
.tag{margin:0;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.c3 .tag{color:var(--ink)}
.card h2{margin:10px 0 0;min-height:2.36em;font-size:24px;line-height:1.18;font-weight:800;letter-spacing:-.02em}
.meta{margin:12px 0 0;font-size:15px;color:var(--ink-45)}
.meta i{font-style:normal;padding:0 7px}

.price{margin-top:26px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price .ap{color:var(--ink-45);font-size:20px}
.price b{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:var(--acc)}
.price span{color:var(--ink-45);font-size:17px}

.desc{margin:26px 0 0;padding-top:26px;border-top:1px solid var(--line);font-size:18px;line-height:1.5;color:var(--ink);font-weight:500;flex:1}
.go{margin-top:32px;display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:17px;transition:gap .2s}
.go svg{color:var(--crimson)}
.c2 .go svg{color:var(--olive)}
.card:hover .go{gap:14px}

.next{
  position:absolute;right:max(16px,env(safe-area-inset-right,0px));
  margin-right:-26px;bottom:calc(80px + 160px);
  width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:#fff;
  display:grid;place-items:center;box-shadow:var(--shadow-lg);cursor:pointer;
}
.next svg{width:22px;height:22px}
.next:focus-visible{outline:3px solid var(--crimson);outline-offset:3px}

@media (max-width:980px){.card h2{min-height:0}
  .cards{grid-template-columns:1fr}
  .next{display:none}
  .card{padding:32px 26px 26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<textarea id="h1" readonly aria-label="Код карточек">&lt;title&gt;Кейсы 1+1 — карточки&lt;/title&gt;

&lt;style&gt;
/* Раскладка: шапка секции → три карточки в ряд (на телефоне в одну колонку) + круглая кнопка-стрелка карусели.
   Светлый регистр бренда: фон cloud, белые карточки, дуэт crimson + olive. */
:root{
  --crimson:#D73A61;
  --olive:#6F8434;
  --olive-soft:#ABAD58;
  --ink:#1B1B1B;
  --cloud:#F6F6F2;
  --white:#FFFFFF;
  --ink-60:rgba(27,27,27,.58);
  --ink-45:rgba(27,27,27,.42);
  --line:rgba(27,27,27,.09);
  --shadow-md:0 8px 28px rgba(27,27,27,.07);
  --shadow-lg:0 16px 40px rgba(27,27,27,.13);
  --font:&quot;Manrope&quot;,&quot;Gilroy&quot;,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--cloud);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
.wrap{
  max-width:1200px;margin:0 auto;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:64px 80px;
}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:40px}
.head h1{margin:0;font-size:clamp(44px,6vw,68px);font-weight:800;letter-spacing:-.03em;line-height:.95}
.head p{margin:12px 0 0;color:var(--ink-60);font-size:18px}
.all{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--olive);font-weight:800;font-size:17px;transition:gap .2s}
.all:hover{gap:14px}
.all svg,.go svg{width:18px;height:18px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:stretch}
.card{
  --acc:var(--crimson);
  display:flex;flex-direction:column;min-width:0;
  background:var(--white);border-radius:28px;padding:40px 36px 32px;
  box-shadow:var(--shadow-md);text-decoration:none;color:inherit;
  transition:transform .22s ease,box-shadow .22s ease;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.card:focus-visible{outline:3px solid var(--crimson);outline-offset:3px}
.c2{--acc:var(--olive)}
.c3{--acc:var(--ink)}

.ico{width:44px;height:44px;color:var(--acc);margin-bottom:34px;display:block}
.ico.m{color:var(--crimson)}
.tag{margin:0;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.c3 .tag{color:var(--ink)}
.card h2{margin:10px 0 0;min-height:2.36em;font-size:24px;line-height:1.18;font-weight:800;letter-spacing:-.02em}
.meta{margin:12px 0 0;font-size:15px;color:var(--ink-45)}
.meta i{font-style:normal;padding:0 7px}

.price{margin-top:26px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price .ap{color:var(--ink-45);font-size:20px}
.price b{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;color:var(--acc)}
.price span{color:var(--ink-45);font-size:17px}

.desc{margin:26px 0 0;padding-top:26px;border-top:1px solid var(--line);font-size:18px;line-height:1.5;color:var(--ink);font-weight:500;flex:1}
.go{margin-top:32px;display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:17px;transition:gap .2s}
.go svg{color:var(--crimson)}
.c2 .go svg{color:var(--olive)}
.card:hover .go{gap:14px}

.next{
  position:absolute;right:max(16px,env(safe-area-inset-right,0px));
  margin-right:-26px;bottom:calc(80px + 160px);
  width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:#fff;
  display:grid;place-items:center;box-shadow:var(--shadow-lg);cursor:pointer;
}
.next svg{width:22px;height:22px}
.next:focus-visible{outline:3px solid var(--crimson);outline-offset:3px}

@media (max-width:980px){.card h2{min-height:0}
  .cards{grid-template-columns:1fr}
  .next{display:none}
  .card{padding:32px 26px 26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

document.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(){
