<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>U3 · Срочные новости: дата героем</title>
<link rel="stylesheet" href="base.css">
<style>.chip{display:inline-flex;align-items:center;gap:18px;padding:14px 34px 16px 28px;border-radius:99px;background:var(--graphite);color:#fff;font-weight:700;font-size:34px;letter-spacing:.16em;text-transform:uppercase}
.chip i{width:20px;height:20px;border-radius:50%;background:var(--crimson-on-dark);display:block}
.big{margin-top:40px;font-weight:800;line-height:.9;letter-spacing:-.045em;color:var(--crimson);white-space:nowrap}
.yr{margin-top:16px;font-weight:700;font-size:72px;letter-spacing:-.02em}.h{margin-top:44px;font-weight:600;font-size:66px;line-height:1.1;letter-spacing:-.02em;white-space:nowrap}</style></head><body>
<div class="canvas paper"><img class="logo" src="../assets/logo-full.png" alt="">
<div class="text-mid"><div class="chip" data-fixed="Срочные новости"><i></i>Срочные новости</div>
<div class="big" data-slot="date" data-fit data-sizes="196,170,140" data-max-lines="1" style="font-size:196px">12 мая</div>
<div class="yr" data-slot="year">2027 года</div>
<div class="h" data-slot="title" data-fit data-sizes="66,58,50" data-max-lines="2">Здесь заголовок<br>срочной новости</div></div></div>
<script src="fit.js"></script></body></html>
