<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Manrope';src:url('Manrope-Variable.ttf');font-weight:200 800;}
:root{--crimson:#D73A61;--olive:#ABAD58;--ink:#1B1B1B;--cloud:#F9F9F9}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;background:var(--cloud)}
body{position:relative;overflow:hidden;font-family:'Manrope',sans-serif}
.pat{position:absolute;left:-60px;bottom:-40px;width:1300px;opacity:.20}
.h{position:absolute;left:90px;right:90px;top:92px;font-weight:800;font-size:74px;line-height:1.0;letter-spacing:-.04em;color:var(--ink)}
.h span{display:block;color:var(--crimson)}
.bar{position:absolute;left:90px;top:64px;width:30px;height:5px;border-radius:3px;background:var(--olive)}
.logo{position:absolute;left:50%;margin-left:-290px;top:310px;width:580px;height:auto}
.badge{position:absolute;right:90px;bottom:80px;width:160px;height:auto}
</style></head><body>
<div class="bar"></div>
<div class="h">Ответ на требования ФНС<span>Как не навредить себе?</span></div>
<img class="logo" src="trebus-cutout.png" alt="Требус">
<img class="badge" src="badge-round.png" alt="">
</body></html>
