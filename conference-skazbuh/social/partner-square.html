<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Cramaten';src:url('Cramaten.ttf');}
@font-face{font-family:'Manrope';src:url('Manrope-Variable.ttf');font-weight:200 800;}
:root{--violet:#7160a3;--red:#d6001f;--tint:#efebf8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px;background:#fff}
body{position:relative;overflow:hidden}
.c{position:absolute;border-radius:50%;background:var(--tint)}
.c.a{left:-240px;top:-300px;width:760px;height:760px}
.c.b{right:-280px;bottom:-300px;width:760px;height:760px}
.bar{position:absolute;left:0;top:0;width:100%;height:14px;background:var(--violet)}
.bar i{position:absolute;right:0;top:0;width:150px;height:14px;background:var(--red)}
.h{position:absolute;left:64px;right:64px;top:84px;font-family:'Cramaten',sans-serif;text-transform:uppercase;color:var(--violet);font-size:128px;line-height:.98;letter-spacing:.015em}
.h .r{display:block;color:var(--red);margin-top:18px}
.logo{position:absolute;left:50%;margin-left:-250px;top:470px;width:500px;height:auto}
.foot{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-family:'Manrope',sans-serif;font-weight:700;font-size:26px;letter-spacing:.04em;color:var(--violet)}
.star{position:absolute;height:auto;width:96px}.s1{left:60px;top:640px}.s2{right:60px;top:560px;transform:rotate(18deg)}
</style></head><body>
<div class="c a"></div><div class="c b"></div><div class="bar"><i></i></div>
<img class="star s1" src="zvezdy-v.png" alt=""><img class="star s2" src="zvezdy-v.png" alt="">
<div class="h">Ответ на требования ФНС.<span class="r">Как не навредить себе?</span></div>
<img class="logo" src="trebus-cutout.png" alt="Требус">
<div class="foot">«Сказочная бухгалтерия» · 5 ноября · Барнаул · skazbuh.ru</div>
</body></html>
