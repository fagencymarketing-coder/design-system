<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><style>
@font-face{font-family:'Manrope';src:url('Manrope-Variable.ttf');font-weight:200 800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1080px}
body{position:relative;overflow:hidden;background:linear-gradient(180deg,#e7e7ee,#fff 62%);font-family:'Manrope',sans-serif}
.blob{position:absolute;border-radius:50%;background:linear-gradient(135deg,rgba(136,153,235,.30),rgba(113,96,163,.22));left:130px;top:540px;width:1000px;height:1000px}
.blob2{position:absolute;border-radius:50%;background:#d6001f;left:-70px;top:900px;width:170px;height:170px}
.logo{position:absolute;left:70px;top:50px;width:170px}
.ln{position:absolute;left:70px;top:175px;width:64px;height:5px;background:#d6001f}
.h{position:absolute;left:70px;right:70px;top:190px;font-weight:800;color:#1b1b2b;font-size:74px;line-height:1.08;letter-spacing:-.025em}
.pill{color:#d6001f}
.h .q{display:block;color:#7160a3;margin-top:.22em}
.card{position:absolute;left:170px;top:610px;width:740px;height:380px;background:#fff;border-radius:56px;box-shadow:0 18px 50px rgba(80,60,150,.14);display:flex;align-items:center;justify-content:center}
.card img{width:300px}
.st{position:absolute;width:110px}
.env{position:absolute;width:170px;left:790px;top:520px;transform:rotate(6deg);filter:drop-shadow(0 10px 18px rgba(80,60,150,.18))}
.st1{left:925px;top:660px}
.st2{left:55px;top:760px;transform:rotate(16deg)}
</style></head><body>
<div class="blob"></div>
<img class="st st2" src="zvezdy-v.png">
<img class="logo" src="logo-conf.png"><div class="ln"></div>
<div class="h">Ответ на требования <span class="pill">ФНС.</span><span class="q">Как не навредить себе?</span></div>
<div class="card"><img src="trebus-cutout.png"></div>
<img class="env" src="envelope.svg">
</body></html>
