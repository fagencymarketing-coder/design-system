<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Manrope';src:url('Manrope-Variable.ttf');font-weight:200 800;}
:root{--crimson:#D73A61;--olive:#ABAD58;--ink:#1B1B1B;--cloud:#F9F9F9}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:var(--cloud)}
body{position:relative;overflow:hidden;font-family:'Manrope',sans-serif}
.pat{position:absolute;left:-80px;bottom:-30px;width:1500px;opacity:.20}
.bar{position:absolute;left:100px;top:300px;width:34px;height:6px;border-radius:3px;background:var(--olive)}
.h{position:absolute;left:100px;right:100px;top:332px;font-weight:800;font-size:70px;white-space:nowrap;line-height:1.0;letter-spacing:-.04em;color:var(--ink)}
.h span{display:block;color:var(--crimson)}
.logo{position:absolute;left:50%;margin-left:-390px;top:600px;width:780px;height:auto}
.badge{position:absolute;right:100px;top:1430px;width:190px;height:auto}
</style></head><body>
<div class="bar"></div>
<div class="h">Ответ на требования ФНС<span>Как не навредить себе?</span></div>
<img class="logo" src="trebus-cutout.png" alt="Требус">
<img class="badge" src="badge-round.png" alt="">
</body></html>
