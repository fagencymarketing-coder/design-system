<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Cramaten';src:url('Cramaten.ttf');}
@font-face{font-family:'Manrope';src:url('Manrope-Variable.ttf');font-weight:200 800;}
:root{--violet:#7160a3;--red:#d6001f;--tint:#efebf8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#fff}
body{position:relative;overflow:hidden}
.c{position:absolute;border-radius:50%;background:var(--tint)}
.c.a{left:-300px;top:-150px;width:900px;height:900px}
.c.b{right:-340px;bottom:-240px;width:960px;height:960px}
.bar{position:absolute;left:0;top:0;width:100%;height:16px;background:var(--violet)}
.bar i{position:absolute;right:0;top:0;width:170px;height:16px;background:var(--red)}
.h{position:absolute;left:64px;right:64px;top:400px;font-family:'Cramaten',sans-serif;text-transform:uppercase;color:var(--violet);font-size:150px;line-height:.98;letter-spacing:.015em}
.h .r{display:block;color:var(--red);margin-top:24px}
.logo{position:absolute;left:50%;margin-left:-360px;top:880px;width:720px;height:auto}
.foot{position:absolute;left:0;right:0;top:1650px;text-align:center;font-family:'Manrope',sans-serif;font-weight:700;font-size:30px;line-height:1.5;letter-spacing:.04em;color:var(--violet)}
.star{position:absolute;height:auto;width:116px}.s1{left:50px;top:800px}.s2{right:56px;top:190px;transform:rotate(18deg)}
</style></head><body>
<div class="c a"></div><div class="c b"></div><div class="bar"><i></i></div>
<img class="star s1" src="zvezdy-v.png" alt=""><img class="star s2" src="zvezdy-v.png" alt="">
<div class="h">Ответ на требования ФНС.<span class="r">Как не навредить себе?</span></div>
<img class="logo" src="trebus-cutout.png" alt="Требус">
<div class="foot">«Сказочная бухгалтерия»<br>5 ноября · Барнаул · skazbuh.ru</div>
</body></html>
