<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<style>
  :root{ --red:#d6001f; --violet:#7160a3; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:600px;height:380px;background:#fff}
  body{font-family:'Liberation Sans',Arial,sans-serif;position:relative;overflow:hidden}
  .band{position:absolute;left:0;top:0;width:100%;height:6px;background:var(--violet)}
  .frame{position:absolute;left:22px;right:22px;top:24px;bottom:22px;border:1.5px solid var(--violet)}
  .c{position:absolute;left:0;right:0;top:24px;bottom:22px;display:flex;flex-direction:column;align-items:center}
  .logo{width:84px;height:auto;margin-top:26px}
  .eye{margin-top:30px;font-size:12.5px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;color:var(--violet)}
  .t{margin-top:8px;text-align:center;font-size:50px;line-height:1.06;font-weight:bold;color:var(--violet)}
  .rule{margin-top:14px;width:96px;height:4px;background:var(--red)}
  .d{margin-top:12px;font-size:23px;font-weight:bold;letter-spacing:.5px;color:var(--red)}
  .v{margin-top:6px;font-size:12px;color:var(--violet)}
</style></head><body>
<div class="band"></div><div class="frame"></div>
<div class="c">
  <img class="logo" src="../assets/logo-purple.png" alt="">
  <div class="eye">III форум главных бухгалтеров</div>
  <div class="t">Сказочная<br>бухгалтерия</div>
  <div class="rule"></div>
  <div class="d">05.11.2026</div>
  <div class="v">г. Барнаул, ул. Пушкина, д. 41 · Театр кукол «Сказка»</div>
</div></body></html>
