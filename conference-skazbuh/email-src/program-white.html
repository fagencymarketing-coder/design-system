<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<style>
  :root{ --red:#d6001f; --violet:#7160a3; --ink:#2b2a29; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:600px;height:340px;background:#fff}
  body{font-family:'Liberation Sans',Arial,sans-serif;padding:0 40px}
  .card{border:2px solid var(--violet);border-radius:18px;padding:24px 26px 18px 26px;height:340px}
  .h{font-size:14px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);margin-bottom:14px}
  .row{display:flex;align-items:center;gap:16px;height:62px}
  .ic{flex:0 0 48px;width:48px;display:flex;justify-content:center;align-items:center}
  .ic img{max-width:40px;max-height:48px;width:auto;height:auto;display:block}
  .tx{flex:1;font-size:16px;line-height:21px;color:var(--ink)}
  .tx b{font-weight:bold}
</style></head><body>
<div class="card">
  <div class="h">Что разбираем на форуме</div>
  <div class="row"><div class="ic"><img src="../assets/tsar.png" alt=""></div><div class="tx"><b>Налоговый контроль</b> — к чему готовиться в 2027&nbsp;году</div></div>
  <div class="row"><div class="ic"><img src="../assets/rubl.png" alt=""></div><div class="tx"><b>Законная налоговая оптимизация</b></div></div>
  <div class="row"><div class="ic"><img src="../assets/keys.png" alt=""></div><div class="tx"><b>Изменения в бухгалтерском учёте</b> и закрытие года</div></div>
  <div class="row"><div class="ic"><img src="../assets/ai.png" alt=""></div><div class="tx"><b>Автоматизация и AI</b> в работе бухгалтера</div></div>
</div></body></html>
