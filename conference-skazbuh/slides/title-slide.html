<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Титульный слайд — Сказочная бухгалтерия</title>
<style>
  /* Палитра: белый, красный, фиолетовый */
  :root{ --white:#ffffff; --red:#d6001f; --violet:#7160a3; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1920px; height:1080px; background:var(--white); }
  body{ font-family:'Liberation Sans',Arial,Helvetica,sans-serif; position:relative; overflow:hidden; }

  .band{ position:absolute; left:0; top:0; width:100%; height:10px; background:var(--violet); }
  .frame{ position:absolute; left:87px; top:77px; right:87px; bottom:36px; border:2px solid var(--violet); }

  .content{ position:absolute; left:0; right:0; top:77px; bottom:36px;
            display:flex; flex-direction:column; align-items:center; }
  .logo{ width:185px; height:auto; margin-top:70px; }
  .eyebrow{ margin-top:150px; font-size:31px; font-weight:bold; letter-spacing:7px;
            text-transform:uppercase; color:var(--violet); }
  .title{ margin-top:18px; text-align:center; font-size:134px; line-height:1.07; font-weight:bold;
          color:var(--violet); }
  .rule{ margin-top:38px; width:265px; height:11px; background:var(--red); }
  .date{ margin-top:34px; font-size:58px; font-weight:bold; letter-spacing:1px; color:var(--red); }

  /* вариант B: дата белым на красной плашке */
  body.b .date{ color:var(--white); background:var(--red); padding:10px 40px 14px 40px; border-radius:60px; margin-top:44px; }
  body.b .rule{ display:none; }
</style>
</head>
<body>
  <div class="band"></div>
  <div class="frame"></div>
  <div class="content">
    <img class="logo" src="logo-purple.png" alt="1+1">
    <div class="eyebrow">III форум главных бухгалтеров</div>
    <div class="title">Сказочная<br>бухгалтерия</div>
    <div class="rule"></div>
    <div class="date">05.11.2026</div>
  </div>
</body>
</html>
