<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Итог в цифрах — R2</title>
<link rel="stylesheet" href="base.css">
<style>
.canvas{background:var(--paper)}

.logo{width:196px}
.text{position:absolute;left:96px;top:300px;right:96px}
.label{font-weight:500;font-size:22px;letter-spacing:.14em;color:var(--stone);text-transform:uppercase;margin-bottom:34px}
.hero{display:flex;align-items:baseline;gap:30px;color:var(--graphite);white-space:nowrap}
.hero .n{font-weight:700;font-size:280px;line-height:.86;letter-spacing:-.035em;color:var(--crimson)}
.hero .u{font-weight:700;font-size:110px;line-height:1;letter-spacing:-.02em}
.cap{margin-top:26px;font-weight:400;font-size:36px;line-height:1.25;color:var(--stone)}
.second{margin-top:64px;display:flex;align-items:baseline;gap:24px}
.second .n{font-weight:700;font-size:110px;line-height:.9;letter-spacing:-.03em;color:var(--graphite)}
.second .u{font-weight:400;font-size:36px;color:var(--stone)}
.foot{position:absolute;left:96px;bottom:96px;font-weight:400;font-size:22px;color:var(--stone)}
</style></head><body>
<div class="canvas">
  <img class="logo" src="../assets/logo-full.png" alt="">
  <div class="text">
    <div class="label">Итог в цифрах</div>
    <div class="hero"><span class="n">6,8</span><span class="u">трлн&nbsp;₽</span></div>
    <p class="cap">сумма подписанных соглашений</p>
    <div class="second"><span class="n">328</span><span class="u">соглашений</span></div>
  </div>
  <div class="foot">По итогам ВЭФ-2026</div>
</div></body></html>
