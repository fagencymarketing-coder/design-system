<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Каталог макетов v2</title>
<style>
@font-face{font-family:Gilroy;font-weight:500;src:url(../assets/fonts/Gilroy-Medium.ttf)}
@font-face{font-family:Gilroy;font-weight:600;src:url(../assets/fonts/Gilroy-Semibold.ttf)}
html,body{margin:0;background:#E9E4DA;width:1800px}
body{font-family:Gilroy,sans-serif;padding:40px 40px 20px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(3,540px);gap:34px 40px;justify-content:center}
figure{margin:0}
figure img{display:block;width:540px;height:540px;border-radius:6px}
figcaption{margin-top:12px;font-size:22px;color:#1C1A17;font-weight:600}
figcaption span{display:block;margin-top:2px;font-size:18px;font-weight:500;color:#6A6965}
</style></head><body><div class="grid">
<figure><img src="v1a-photo-plate.png"><figcaption>V1-А · Фото и вопрос, с плашкой<span>налоги, проверки, консультации</span></figcaption></figure>
<figure><img src="v1b-photo-rule.png"><figcaption>V1-Б · Фото и вопрос, без плашки<span>то же, подзаголовок-пояснение</span></figcaption></figure>
<figure><img src="v2-news-graphite.png"><figcaption>V2 · Новость на графите<span>законы, события, даты</span></figcaption></figure>
<figure><img src="v3-news-green.png"><figcaption>V3 · Новость на зелёном<span>то же, крупный заголовок, редко</span></figcaption></figure>
<figure><img src="v4-number.png"><figcaption>V4 · Цифра<span>итоги, рейтинги, статистика</span></figcaption></figure>
<figure><img src="v5-list.png"><figcaption>V5 · Список<span>услуги, шаги, чек-листы</span></figcaption></figure>
<figure><img src="v6-team.png"><figcaption>V6 · Команда<span>знакомство, найм, обучение</span></figcaption></figure>
<figure><img src="v7-thesis.png"><figcaption>V7 · Тезис<span>мысль, цитата, без фото</span></figcaption></figure>
<figure><img src="v8-fragment.png"><figcaption>V8 · Фрагмент<span>о компании, фирменный предмет</span></figcaption></figure>
<figure><img src="v9-case.png"><figcaption>V9 · Кейс с экспертом<span>результат клиента, портрет сотрудника</span></figcaption></figure>
<figure><img src="v10-photo-large.png"><figcaption>V10 · Фото крупно<span>фото главнее текста, 60% холста</span></figcaption></figure>
</div></body></html>
