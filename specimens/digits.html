<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Итог в цифрах — R2</title>
<link rel="stylesheet" href="base.css">
<style>
.canvas{background:var(--paper)}
.ruble{position:absolute;right:-10px;bottom:-60px;font-weight:800;font-size:520px;line-height:1;
  background:linear-gradient(180deg,#9A9C48 0%,#82842F 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{width:196px}
.text{position:absolute;left:96px;top:292px;right:96px}
.label{font-weight:500;font-size:22px;letter-spacing:.14em;color:var(--stone);text-transform:uppercase;margin-bottom:34px}
.hero{display:flex;align-items:baseline;gap:30px;color:var(--graphite);white-space:nowrap}
.hero .n{font-weight:700;font-size:250px;line-height:.86;letter-spacing:-.035em;color:var(--crimson)}
.hero .u{font-weight:700;font-size:100px;line-height:1;letter-spacing:-.02em}
.cap{margin-top:26px;font-weight:400;font-size:38px;line-height:1.25;color:var(--stone)}
.second{margin-top:56px;padding-top:36px;border-top:1.5px solid var(--sand);display:flex;align-items:baseline;gap:26px;width:520px}
.second .n{font-weight:700;font-size:104px;line-height:.9;letter-spacing:-.03em;color:var(--graphite)}
.second .u{font-weight:500;font-size:38px;color:var(--stone)}
.foot{position:absolute;left:96px;bottom:96px;font-weight:400;font-size:24px;color:var(--stone)}
</style></head><body>
<div class="canvas">
  <div class="ruble">₽</div>
  <img class="logo" src="../assets/logo-full.png" alt="">
  <div class="text">
    <div class="label">Итог в цифрах</div>
    <div class="hero"><span class="n">6,8</span><span class="u">трлн&nbsp;₽</span></div>
    <p class="cap">сумма подписанных соглашений</p>
    <div class="second"><span class="n">328</span><span class="u">соглашений</span></div>
  </div>
  <div class="foot">По итогам ВЭФ-2026</div>
</div></body></html>
