<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Заголовок и фото в рамке</title>
<link rel="stylesheet" href="base.css">
<style>
.canvas{background:var(--paper);color:var(--graphite)}
.mark{position:absolute;right:-140px;top:-170px;width:400px;height:400px;background:var(--olive-bright);opacity:.26;-webkit-mask:url(../assets/icons/gear.svg) center/contain no-repeat;mask:url(../assets/icons/gear.svg) center/contain no-repeat}
.photo{position:absolute;left:96px;right:96px;bottom:96px;height:470px;border-radius:8px;background:url(../assets/team/color-0768.jpg) center 40%/cover;filter:saturate(.88)}
.h-s{font-size:60px}
</style></head><body>
<div class="canvas">
  <div class="mark"></div>
  <img class="logo" src="../assets/logo-full.png" alt="">
  <div class="text-top">
    <div class="dash"></div>
    <div class="h-s">Как замотивировать себя и<br>сотрудников на эффективную<br>работу <em class="acc">после лета</em></div>
  </div>
  <div class="photo"></div>
</div></body></html>
