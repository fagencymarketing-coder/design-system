<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Закон о цифровых платформах — R4, оливковый</title>
<link rel="stylesheet" href="base.css">
<style>
:root{--olive-field:#8E903C}
.canvas{background:linear-gradient(180deg,#9A9C48 0%,#82842F 100%)}
.pattern{position:absolute;right:-300px;top:-160px;width:1240px;height:1620px;
  background:url(../assets/pattern-2.png) center/cover;filter:brightness(1.6);opacity:.14;
  -webkit-mask-image:linear-gradient(to left,#000 0,rgba(0,0,0,.5) 45%,transparent 90%);
          mask-image:linear-gradient(to left,#000 0,rgba(0,0,0,.5) 45%,transparent 90%)}
.logo{width:210px}
.text{position:absolute;left:96px;right:60px;bottom:96px;color:#fff}
.label{font-weight:500;font-size:24px;letter-spacing:.14em;color:rgba(255,255,255,.86);text-transform:uppercase;margin-bottom:38px;display:flex;align-items:center;gap:22px}
.label i{display:block;width:64px;height:3px;background:rgba(255,255,255,.86)}
h1{font-weight:700;font-size:146px;line-height:.96;letter-spacing:-.035em;margin-left:-6px}
.date{margin-top:44px;font-weight:500;font-size:56px;letter-spacing:-.005em;color:rgba(255,255,255,.72)}
.date b{font-weight:600;color:#fff}
</style></head><body>
<div class="canvas">
  <div class="pattern"></div>
  <img class="logo" src="../assets/logo-full-white.png" alt="">
  <div class="text">
    <div class="label"><i></i>Новое в законе</div>
    <h1>Закон о<br>цифровых<br>платформах</h1>
    <p class="date">с <b>1&nbsp;октября 2026&nbsp;года</b></p>
  </div>
</div></body></html>
